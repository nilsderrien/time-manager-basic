name: Sync to school repo

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: sync-school-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to school repo
        env:
          SCHOOL_REPO_TOKEN: ${{ secrets.SCHOOL_REPO_TOKEN }}
          SCHOOL_REPO_URL: ${{ vars.SCHOOL_REPO_URL }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git remote add school "https://x-access-token:${SCHOOL_REPO_TOKEN}@${SCHOOL_REPO_URL}"
          git push school "HEAD:refs/heads/${BRANCH}"