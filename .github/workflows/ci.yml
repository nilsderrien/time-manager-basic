name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  COVERAGE_THRESHOLD: '80'

jobs:
  lint-backend:
    if: github.repository == 'nilsderrien/time-manager-basic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          echo "::group::npm ci (backend)"
          npm ci
          echo "::endgroup::"

      - name: Run backend typecheck and Biome check
        working-directory: backend
        run: |
          echo "::group::npm run check (backend)"
          npm run check
          echo "::endgroup::"

  lint-frontend:
    if: github.repository == 'nilsderrien/time-manager-basic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          echo "::group::npm ci (frontend)"
          npm ci
          echo "::endgroup::"

      - name: Run frontend lint
        working-directory: frontend
        run: |
          echo "::group::npm run lint (frontend)"
          npm run lint
          echo "::endgroup::"

  test-backend:
    if: github.repository == 'nilsderrien/time-manager-basic'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for PostgreSQL to become ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -U ci -d ci; then
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          pg_isready -h localhost -U ci -d ci

      - name: Initialize PostgreSQL schema
        env:
          PGPASSWORD: ci
        run: |
          echo "::group::Initialize PostgreSQL schema"
          psql -h localhost -U ci -d ci -f "$GITHUB_WORKSPACE/database/init.sql"
          echo "::endgroup::"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          echo "::group::npm ci (backend tests)"
          npm ci
          echo "::endgroup::"

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          mkdir -p coverage
          echo "::group::Backend tests and native coverage"
          set +e
          node --import tsx \
            --experimental-test-coverage \
            --test-coverage-exclude='tests/**/*.test.ts' \
            --test-reporter=spec \
            --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=coverage/lcov.info \
            --test 'tests/**/*.test.ts'
          test_result=$?
          set -e
          echo "::endgroup::"

          if [ ! -s coverage/lcov.info ]; then
            echo "| Coverage | unavailable | ${COVERAGE_THRESHOLD}% | KO |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The backend test run did not produce coverage/lcov.info."
            exit 1
          fi

          coverage_data=$(awk -F '[:,]' '/^DA:/ { total++; if ($3 > 0) covered++ } END { if (total == 0) { print "0 0 0.00" } else { printf "%d %d %.2f", covered, total, covered * 100 / total } }' coverage/lcov.info)
          read -r covered_lines total_lines coverage_percent <<< "$coverage_data"
          coverage_ok=$(awk -v actual="$coverage_percent" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN { print (actual >= threshold) ? "yes" : "no" }')

          if [ "$test_result" -ne 0 ]; then
            coverage_status=KO
          elif [ "$coverage_ok" = "yes" ]; then
            coverage_status=OK
          else
            coverage_status=WARNING
          fi

          {
            echo "## Backend test coverage"
            echo "| Metric | Result | Threshold | Status |"
            echo "| --- | ---: | ---: | :---: |"
            echo "| Line coverage | ${coverage_percent}% (${covered_lines}/${total_lines}) | ${COVERAGE_THRESHOLD}% | ${coverage_status} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$coverage_ok" != "yes" ]; then
            echo "::warning::Backend line coverage is below the ${COVERAGE_THRESHOLD}% target: ${coverage_percent}% (${covered_lines}/${total_lines} lines)."
          fi
          if [ "$test_result" -ne 0 ]; then
            echo "::error::Backend test run failed with exit code ${test_result}."
            exit 1
          fi

      - name: Upload backend LCOV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-lcov
          path: backend/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  build-backend:
    if: github.repository == 'nilsderrien/time-manager-basic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          echo "::group::npm ci (backend build)"
          npm ci
          echo "::endgroup::"

      - name: Build backend
        working-directory: backend
        run: |
          echo "::group::npm run build (backend)"
          npm run build
          echo "::endgroup::"

  build-frontend:
    if: github.repository == 'nilsderrien/time-manager-basic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          echo "::group::npm ci (frontend build)"
          npm ci
          echo "::endgroup::"

      - name: Build frontend
        working-directory: frontend
        run: |
          echo "::group::npm run build (frontend)"
          npm run build
          echo "::endgroup::"

  audit:
    if: github.repository == 'nilsderrien/time-manager-basic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Audit backend production dependencies
        working-directory: backend
        run: |
          echo "::group::npm audit (backend production dependencies)"
          npm audit --omit=dev --audit-level=high
          echo "::endgroup::"

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: |
          echo "::group::npm audit (frontend production dependencies)"
          npm audit --omit=dev --audit-level=high
          echo "::endgroup::"

  build-images:
    if: github.repository == 'nilsderrien/time-manager-basic'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint-backend
      - lint-frontend
      - test-backend
      - build-backend
      - build-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: time-manager-backend:ci
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: time-manager-frontend:ci
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend